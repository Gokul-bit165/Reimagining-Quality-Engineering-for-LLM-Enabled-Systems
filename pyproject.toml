[project]
name = "qe"
version = "0.0.1"
description = "Multi-agent pre-release verification platform for LLM applications (working title)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "typer>=0.12"]

[project.optional-dependencies]
deepeval = []  # pinned in M3 behind VerifierPort
ragas = []     # pinned in M2 behind GeneratorPort

[project.scripts]
qe = "qe.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "syrupy>=4", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
